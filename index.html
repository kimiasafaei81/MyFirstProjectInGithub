<script>
    // اینجا JSON تولیدشده را قرار خواهی داد:
    // const neighborhoods = [ ... ];

    // مقداردهی به Select و فعال‌کردن Choices
    function initNeighborhoodSelect() {
        const select = document.getElementById("Neighborhood");

        neighborhoods.forEach(n => {
            const opt = document.createElement("option");
            opt.value = n.code;  // همان Address_Encoded
            opt.textContent = `${n.name} – ${n.code}`;
            select.appendChild(opt);
        });

        new Choices('#Neighborhood', {
            searchPlaceholderValue: "جستجوی محله...",
            noResultsText: "نتیجه‌ای یافت نشد",
            itemSelectText: "",
            shouldSort: false
        });
    }

    async function sendData() {
        const resultDiv = document.getElementById("result");
        resultDiv.textContent = "در حال ارسال درخواست...";

        const addressEncoded = Number(document.getElementById("Neighborhood").value);
        if (!addressEncoded) {
            resultDiv.innerHTML = `<span class="error">لطفاً محله را انتخاب کنید.</span>`;
            return;
        }

        const buildYear = Number(document.getElementById("BuildYear").value);
        if (!buildYear) {
            resultDiv.innerHTML = `<span class="error">لطفاً سال ساخت را وارد کنید.</span>`;
            return;
        }

        const age = 1404 - buildYear;

        const elevator = document.getElementById("Elevator").checked ? 1 : 0;
        const parking = document.getElementById("Parking").checked ? 1 : 0;
        const warehouse = document.getElementById("Warehouse").checked ? 1 : 0;

        const totalFacilities = elevator + parking + warehouse;

        const data = {
            Elevator: elevator,
            Floor: Number(document.getElementById("Floor").value),
            Area: Number(document.getElementById("Area").value),
            Parking: parking,
            Room: Number(document.getElementById("Room").value),
            Warehouse: warehouse,
            Age: age,
            Address_Encoded: addressEncoded,
            HasParkingElevatorWarehouse: totalFacilities
        };

        try {
            const response = await fetch("/predict", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(data)
            });

            const result = await response.json();
            resultDiv.textContent =
                "قیمت پیش‌بینی شده: " +
                result.predicted_price.toLocaleString("fa-IR") +
                " تومان";

        } catch (error) {
            resultDiv.innerHTML =
                `<span class="error">خطا در ارتباط با سرور: ${error}</span>`;
        }
    }

    // وقتی صفحه لود شد، Select را پر کن
    window.addEventListener("DOMContentLoaded", initNeighborhoodSelect);
</script>

</body>
</html>
